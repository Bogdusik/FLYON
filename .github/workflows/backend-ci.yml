name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Unit tests mock the database; the ingest benchmark needs PostGIS and is run by hand (docs/performance)
      - run: npm test -- --ci
