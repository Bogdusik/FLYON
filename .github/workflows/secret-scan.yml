name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks (new commits only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan only the commits this event introduces, so tokens already in history (and rotated) don't fail CI
      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${SHA}"
          else
            base="$(git merge-base "origin/${DEFAULT_BRANCH}" "$SHA")"
            range="${base}..${SHA}"
          fi
          echo "Scanning commits in ${range}:"
          git log --oneline "$range"
          echo "log_opts=${range}" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks
        run: gitleaks git --log-opts="${{ steps.range.outputs.log_opts }}" --config .gitleaks.toml --redact --verbose --exit-code 1 .
